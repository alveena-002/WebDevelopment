<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TradePro 360 — Smart Booking &amp; Dispatch Platform</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#14213D;
  --ink-soft:#1F3157;
  --paper:#F5F3EE;
  --card:#FFFFFF;
  --line:#E2DED3;
  --slate:#5C6672;
  --amber:#FF9F1C;
  --amber-deep:#E08A00;
  --teal:#0F8B8D;
  --teal-soft:#E4F3F3;
  --success:#2E7D46;
  --danger:#C0392B;
  --radius:10px;
  --shadow:0 1px 2px rgba(20,33,61,.06), 0 8px 24px -12px rgba(20,33,61,.18);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif; margin:0; letter-spacing:-.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--amber); color:var(--ink);}

/* ---------- App shell ---------- */
.app{display:grid; grid-template-columns:76px 1fr; min-height:100vh;}
@media (max-width:820px){ .app{grid-template-columns:1fr;} }

/* Sidebar */
.rail{
  background:var(--ink);
  display:flex; flex-direction:column; align-items:center;
  padding:18px 0; gap:6px; position:sticky; top:0; height:100vh;
}
@media (max-width:820px){
  .rail{position:fixed; bottom:0; left:0; right:0; width:100%; height:auto; flex-direction:row; justify-content:space-around; padding:8px 4px; z-index:50; top:auto;}
}
.rail-logo{
  width:38px; height:38px; border-radius:9px; background:var(--amber);
  display:flex; align-items:center; justify-content:center; margin-bottom:18px;
  color:var(--ink); font-family:'Space Grotesk'; font-weight:700; font-size:15px;
}
@media (max-width:820px){ .rail-logo{display:none;} }
.rail-btn{
  width:48px; height:48px; border-radius:10px; border:none; background:transparent;
  color:#8894B0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; font-size:9px; letter-spacing:.02em; transition:all .15s ease;
}
.rail-btn svg{width:19px; height:19px;}
.rail-btn:hover{color:#fff; background:rgba(255,255,255,.06);}
.rail-btn.active{color:var(--ink); background:var(--amber);}
.rail-spacer{flex:1;}
@media (max-width:820px){ .rail-spacer{display:none;} }
.rail-live{
  width:48px; height:48px; display:flex; align-items:center; justify-content:center;
}
@media (max-width:820px){ .rail-live{display:none;} }
.pulse-dot{width:8px; height:8px; border-radius:50%; background:var(--success); position:relative;}
.pulse-dot::after{
  content:''; position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--success);
  animation:pulse 2s infinite;
}
@keyframes pulse{0%{transform:scale(.5); opacity:1;} 100%{transform:scale(1.8); opacity:0;}}

/* Main */
.main{padding:28px 32px 90px; max-width:1180px; margin:0 auto; width:100%;}
@media (max-width:820px){ .main{padding:20px 16px 90px;} }
.topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; flex-wrap:wrap; gap:12px;}
.eyebrow{
  font-family:'JetBrains Mono'; font-size:11px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--teal); font-weight:600; margin-bottom:6px; display:block;
}
.view-title{font-size:26px; font-weight:700;}
.view-sub{color:var(--slate); font-size:14.5px; margin-top:4px; max-width:560px;}
.brandbar{display:flex; align-items:center; gap:10px;}
.brand-chip{
  display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line);
  border-radius:100px; padding:6px 14px 6px 8px; box-shadow:var(--shadow); font-size:13px; font-weight:600;
}
.brand-chip .dot{width:8px; height:8px; border-radius:50%;}

/* Cards */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
  box-shadow:var(--shadow); padding:22px;
}
.grid2{display:grid; grid-template-columns:1.1fr .9fr; gap:20px;}
@media (max-width:980px){ .grid2{grid-template-columns:1fr;} }
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
@media (max-width:700px){ .grid3{grid-template-columns:1fr;} }

/* Form bits */
label.field-label{display:block; font-size:12.5px; font-weight:600; color:var(--slate); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
input[type=text],input[type=tel],input[type=email],select,textarea{
  width:100%; padding:11px 12px; border:1.5px solid var(--line); border-radius:8px; font-size:14.5px;
  font-family:inherit; background:#FCFBF8; color:var(--ink); transition:border-color .15s;
}
input:focus,select:focus,textarea:focus{outline:none; border-color:var(--teal); background:#fff;}
.field{margin-bottom:16px;}
.svc-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px;}
@media (max-width:560px){ .svc-grid{grid-template-columns:1fr;} }
.svc-card{
  border:1.5px solid var(--line); border-radius:9px; padding:14px 12px; text-align:left; background:#fff;
  transition:all .15s;
}
.svc-card:hover{border-color:var(--teal);}
.svc-card.selected{border-color:var(--amber); background:#FFF7EA; box-shadow:0 0 0 3px rgba(255,159,28,.15);}
.svc-icon{font-size:20px; margin-bottom:6px; display:block;}
.svc-name{font-weight:700; font-size:14px;}
.svc-desc{font-size:12px; color:var(--slate); margin-top:2px;}

.job-list{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
.job-row{
  display:flex; align-items:center; justify-content:space-between; border:1.5px solid var(--line);
  border-radius:8px; padding:11px 13px; background:#fff; cursor:pointer;
}
.job-row.selected{border-color:var(--teal); background:var(--teal-soft);}
.job-row .name{font-weight:600; font-size:13.5px;}
.job-row .sub{font-size:11.5px; color:var(--slate);}
.job-row .price{font-family:'JetBrains Mono'; font-weight:600; font-size:13.5px;}

.quote-box{background:var(--ink); color:#fff; border-radius:10px; padding:18px; margin-top:16px;}
.quote-row{display:flex; justify-content:space-between; font-size:13.5px; padding:5px 0; color:#B9C2D6;}
.quote-row.total{color:#fff; font-weight:700; font-size:17px; border-top:1px solid rgba(255,255,255,.15); margin-top:8px; padding-top:12px;}
.quote-row .val{font-family:'JetBrains Mono';}

.btn{
  border:none; border-radius:8px; padding:12px 18px; font-weight:700; font-size:14px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:all .15s;
}
.btn-primary{background:var(--amber); color:var(--ink);}
.btn-primary:hover{background:var(--amber-deep);}
.btn-primary:disabled{background:#E7E2D6; color:#A9A08C; cursor:not-allowed;}
.btn-dark{background:var(--ink); color:#fff;}
.btn-dark:hover{background:var(--ink-soft);}
.btn-outline{background:transparent; border:1.5px solid var(--line); color:var(--ink);}
.btn-outline:hover{border-color:var(--ink);}
.btn-block{width:100%;}
.btn-sm{padding:8px 12px; font-size:12.5px;}

.locate-row{display:flex; gap:8px;}
.locate-row input{flex:1;}
.loc-pill{display:inline-flex; align-items:center; gap:6px; background:var(--teal-soft); color:var(--teal); font-size:12.5px; font-weight:600; padding:6px 10px; border-radius:100px; margin-top:8px;}

/* Tracking view */
#map{height:340px; border-radius:10px; border:1px solid var(--line); z-index:0;}
.status-track{display:flex; margin:18px 0 4px; position:relative;}
.status-step{flex:1; text-align:center; position:relative;}
.status-step .stick{
  width:26px; height:26px; border-radius:50%; background:#fff; border:2.5px solid var(--line); margin:0 auto 6px;
  display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:var(--slate); position:relative; z-index:2;
}
.status-step.done .stick{background:var(--teal); border-color:var(--teal); color:#fff;}
.status-step.active .stick{background:var(--amber); border-color:var(--amber); color:var(--ink); box-shadow:0 0 0 5px rgba(255,159,28,.2);}
.status-step .lbl{font-size:11px; font-weight:600; color:var(--slate);}
.status-step.done .lbl,.status-step.active .lbl{color:var(--ink);}
.status-line{position:absolute; top:13px; left:0; right:0; height:2.5px; background:var(--line); z-index:1;}
.status-line-fill{position:absolute; top:13px; left:0; height:2.5px; background:var(--teal); z-index:1; transition:width .4s ease;}

.eng-card{display:flex; gap:12px; align-items:center;}
.avatar{
  width:46px; height:46px; border-radius:50%; background:var(--ink); color:#fff; display:flex;
  align-items:center; justify-content:center; font-weight:700; font-family:'Space Grotesk'; font-size:15px; flex-shrink:0;
}
.eta-badge{background:var(--teal-soft); color:var(--teal); font-weight:700; font-family:'JetBrains Mono'; padding:8px 12px; border-radius:8px; font-size:13px;}

/* Portal */
.chat-window{height:280px; overflow-y:auto; border:1px solid var(--line); border-radius:10px; padding:14px; background:#FCFBF8; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:75%; padding:9px 12px; border-radius:12px; font-size:13.5px; line-height:1.4;}
.msg.them{background:#fff; border:1px solid var(--line); align-self:flex-start; border-bottom-left-radius:3px;}
.msg.me{background:var(--ink); color:#fff; align-self:flex-end; border-bottom-right-radius:3px;}
.msg .time{display:block; font-size:10px; opacity:.6; margin-top:3px;}
.chat-input-row{display:flex; gap:8px; margin-top:10px;}
.chat-input-row input{flex:1;}

.photo-drop{
  border:2px dashed var(--line); border-radius:10px; padding:22px; text-align:center; cursor:pointer; background:#FCFBF8;
}
.photo-drop:hover{border-color:var(--teal);}
.photo-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:12px;}
.photo-grid img{width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; border:1px solid var(--line);}

.stars{display:flex; gap:6px; font-size:28px; margin:10px 0;}
.star{color:#DCD6C6; cursor:pointer; transition:color .1s;}
.star.filled{color:var(--amber);}

/* Invoice */
.inv-header{display:flex; justify-content:space-between; align-items:flex-start; padding-bottom:16px; border-bottom:1.5px solid var(--line);}
.inv-table{width:100%; border-collapse:collapse; margin:16px 0;}
.inv-table th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--slate); padding:8px 0; border-bottom:1.5px solid var(--line);}
.inv-table td{padding:10px 0; font-size:13.5px; border-bottom:1px solid var(--line);}
.inv-table td.amt{text-align:right; font-family:'JetBrains Mono';}
.inv-total-row td{font-weight:700; font-size:16px; border-bottom:none;}
.pay-toggle{display:flex; gap:8px; margin:16px 0;}
.pay-opt{flex:1; border:1.5px solid var(--line); border-radius:8px; padding:12px; text-align:center; cursor:pointer;}
.pay-opt.selected{border-color:var(--amber); background:#FFF7EA;}
.pay-opt .t{font-weight:700; font-size:13.5px;}
.pay-opt .s{font-size:11px; color:var(--slate); margin-top:2px;}

/* Admin */
.kpi{display:flex; flex-direction:column; gap:4px;}
.kpi .num{font-family:'Space Grotesk'; font-size:26px; font-weight:700;}
.kpi .lbl{font-size:12px; color:var(--slate); text-transform:uppercase; letter-spacing:.03em; font-weight:600;}
.kpi .delta{font-size:11.5px; color:var(--success); font-weight:600;}
table.admin-table{width:100%; border-collapse:collapse; font-size:13px;}
table.admin-table th{text-align:left; padding:9px 10px; background:#FAF8F3; color:var(--slate); font-size:11px; text-transform:uppercase; letter-spacing:.03em; border-bottom:1.5px solid var(--line);}
table.admin-table td{padding:10px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
table.admin-table tr:hover td{background:#FCFBF8;}
.badge{padding:4px 9px; border-radius:100px; font-size:11px; font-weight:700; display:inline-block;}
.badge.pending{background:#FDF1DC; color:#A8710B;}
.badge.dispatched{background:var(--teal-soft); color:var(--teal);}
.badge.progress{background:#E7EEFB; color:#2A5DBB;}
.badge.done{background:#E5F3E8; color:var(--success);}
.eng-roster-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--line);}
.eng-roster-row:last-child{border-bottom:none;}
.status-tag{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
.status-tag.avail{background:var(--success);}
.status-tag.busy{background:var(--amber);}

.color-swatches{display:flex; gap:8px; margin-top:6px;}
.swatch{width:26px; height:26px; border-radius:6px; cursor:pointer; border:2px solid transparent;}
.swatch.active{border-color:var(--ink);}

.empty{text-align:center; padding:50px 20px; color:var(--slate);}
.empty .big{font-size:34px; margin-bottom:8px;}

.hint{font-size:12px; color:var(--slate); margin-top:6px; line-height:1.5;}
.divider{height:1px; background:var(--line); margin:20px 0;}
.tag-row{display:flex; gap:8px; flex-wrap:wrap;}
.mini-tag{background:var(--paper); border:1px solid var(--line); padding:4px 10px; border-radius:100px; font-size:11.5px; font-weight:600; color:var(--slate);}
</style>
</head>
<body>

<div id="connBanner" style="position:sticky; top:0; z-index:100; display:flex; align-items:center; gap:10px; padding:8px 16px; background:#14213D; color:#B9C2D6; font-family:'JetBrains Mono',monospace; font-size:12px; flex-wrap:wrap;">
  <span id="connDot" style="width:8px; height:8px; border-radius:50%; background:#C0392B; flex-shrink:0;"></span>
  <span id="connText">Checking backend…</span>
  <span style="flex:1;"></span>
  <label style="display:flex; align-items:center; gap:6px;">API base:
    <input id="apiBaseInput" type="text" value="http://localhost:4000" style="background:#1F3157; border:1px solid #34477A; color:#fff; border-radius:5px; padding:4px 8px; font-family:inherit; font-size:12px; width:200px;">
  </label>
  <button id="apiBaseBtn" style="background:#FF9F1C; border:none; color:#14213D; font-weight:700; border-radius:5px; padding:5px 10px; font-size:12px; cursor:pointer;">Reconnect</button>
</div>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <main class="main" id="main"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
<script>
/* =====================================================================
   TradePro 360 — front-end demo of the full booking & dispatch platform.
   Everything runs in-browser against mock data so the whole flow (GMB
   entry -> quote -> AI dispatch -> live tracking -> portal -> invoice ->
   admin) can be experienced end to end without a live backend.
   ===================================================================== */

/* ---------------- Mock data ---------------- */
const SERVICES = [
  {id:'plumbing', name:'Plumbing', icon:'🔧', desc:'Leaks, boilers, drains'},
  {id:'electrical', name:'Electrical', icon:'⚡', desc:'Wiring, sockets, fuse boards'},
  {id:'cleaning', name:'Cleaning', icon:'🧽', desc:'Homes, end of tenancy'},
];

const JOB_TYPES = {
  plumbing:[
    {id:'tap', name:'Leaking tap repair', part:15, labour:45},
    {id:'drain', name:'Blocked drain clearance', part:0, labour:60},
    {id:'boiler', name:'Boiler service', part:40, labour:90},
    {id:'toilet', name:'Toilet repair', part:20, labour:50},
    {id:'burst', name:'Emergency pipe burst', part:35, labour:120},
  ],
  electrical:[
    {id:'socket', name:'Socket replacement', part:8, labour:40},
    {id:'fuseboard', name:'Fuse board upgrade', part:180, labour:150},
    {id:'light', name:'Light fitting install', part:25, labour:45},
    {id:'outage', name:'Emergency power outage', part:0, labour:110},
  ],
  cleaning:[
    {id:'standard', name:'Standard clean (2hr)', part:0, labour:50},
    {id:'deep', name:'Deep clean (4hr)', part:15, labour:95},
    {id:'tenancy', name:'End of tenancy clean', part:20, labour:140},
    {id:'carpet', name:'Carpet cleaning', part:10, labour:65},
  ],
};

const ENGINEERS = [
  {id:'e1', name:'Dave Whitfield', trade:'plumbing', lat:51.5074, lng:-0.1278, city:'London', rating:4.9, status:'available'},
  {id:'e2', name:'Priya Anand', trade:'plumbing', lat:52.4862, lng:-1.8904, city:'Birmingham', rating:4.8, status:'available'},
  {id:'e3', name:'Tom Ridley', trade:'electrical', lat:53.4808, lng:-2.2426, city:'Manchester', rating:4.7, status:'available'},
  {id:'e4', name:'Sam O\u2019Connell', trade:'electrical', lat:51.4545, lng:-2.5879, city:'Bristol', rating:4.9, status:'busy'},
  {id:'e5', name:'Leah Fletcher', trade:'cleaning', lat:53.8008, lng:-1.5491, city:'Leeds', rating:4.95, status:'available'},
  {id:'e6', name:'Mo Farouk', trade:'plumbing', lat:55.9533, lng:-3.1883, city:'Edinburgh', rating:4.6, status:'available'},
  {id:'e7', name:'Grace Nyland', trade:'cleaning', lat:53.4084, lng:-2.9916, city:'Liverpool', rating:4.8, status:'available'},
  {id:'e8', name:'Ryan Kettle', trade:'electrical', lat:54.9783, lng:-1.6178, city:'Newcastle', rating:4.75, status:'available'},
];

/* ---------------- State ---------------- */
const state = {
  view:'book',
  brand:{name:'TradePro 360', color:'#FF9F1C'},
  booking:{ service:null, jobType:null, coords:null, addressLabel:'', name:'', phone:'' },
  bookings:[],   // all bookings created this session (admin view)
  activeBookingId:null,
  chat:[],
  photos:[],
  rating:0,
  map:null, marker:null, custMarker:null, routeLine:null, animTimer:null,
};

/* ---------------- Backend connectivity ---------------- */
let API_BASE = 'http://localhost:4000';
let backendOnline = false;
let socket = null;
let joinedRoom = null;
let authToken = null;
let authUser = null;

const FE_TO_BE_STATUS = { dispatched:'dispatched', enroute:'en_route', progress:'in_progress', done:'completed' };
const BE_TO_FE_STATUS = { pending:'dispatched', dispatched:'dispatched', en_route:'enroute', in_progress:'progress', completed:'done', cancelled:'done' };

function normalizeBackendBooking(b){
  return {
    id: b.id,
    service: b.service,
    jobType: b.job_type_name,
    part: b.part_cost, labour: b.labour_cost, vat: b.vat, total: b.total,
    customer: { name:b.customer_name, phone:b.customer_phone, coords:{lat:b.customer_lat, lng:b.customer_lng}, address:b.address_label },
    engineer: { name:b.engineer.name, trade:b.engineer.trade, rating:b.engineer.rating_avg, lat:b.engineer.lat, lng:b.engineer.lng },
    distanceKm: b.distance_km,
    etaMin: b.eta_min,
    status: BE_TO_FE_STATUS[b.status] || 'dispatched',
    createdAt: new Date(b.created_at),
    payment: b.payment_method,
    paid: !!b.paid,
    review: null,
    remote: true,
  };
}

async function tryConnectBackend(showAlertOnFail){
  const dot = document.getElementById('connDot');
  const text = document.getElementById('connText');
  try{
    const res = await fetch(`${API_BASE}/api/health`, {signal: AbortSignal.timeout(3000)});
    if(!res.ok) throw new Error('bad response');
    backendOnline = true;
    if(dot) dot.style.background = '#2E7D46';
    if(text) text.textContent = `Connected to live backend — real database, dispatch & payments active (${API_BASE})`;

    // Pull the live price list so quotes reflect the database, not the hard-coded fallback.
    try{
      const svc = await fetch(`${API_BASE}/api/services`).then(r=>r.json());
      Object.keys(svc).forEach(trade=>{
        JOB_TYPES[trade] = svc[trade].map(j=>({id:j.id, name:j.name, part:j.part, labour:j.labour}));
      });
    }catch(e){ /* keep local fallback prices if this fails */ }

    connectSocket();
  }catch(e){
    backendOnline = false;
    if(dot) dot.style.background = '#C0392B';
    if(text) text.textContent = `No backend detected at ${API_BASE} — running in local demo mode (see TradePro360-Backend.zip)`;
    if(showAlertOnFail) console.warn('Backend connection failed:', e);
  }
}

function connectSocket(){
  if(typeof io === 'undefined') return;
  if(socket) socket.disconnect();
  socket = io(API_BASE, {transports:['websocket','polling']});
  socket.on('booking:update', payload=>{
    const b = state.bookings.find(x=>x.id===payload.id);
    if(b){
      Object.assign(b, normalizeBackendBooking(payload));
      if(state.view==='track' || state.view==='admin') render();
    }
  });
  socket.on('engineer:location', payload=>{
    if(state.activeBookingId===payload.bookingId && state.map){
      updateLiveEngineerMarker(payload.lat, payload.lng);
    }
  });
  socket.on('chat:message', msg=>{
    if(state.activeBookingId===msg.booking_id){
      const already = state.chat.some(m=>m.id===msg.id);
      if(!already){
        state.chat.push({id:msg.id, from: msg.sender==='engineer'?'them':'me', text:msg.body, time:new Date(msg.created_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})});
        if(state.view==='portal') render();
      }
    }
  });
}

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371, dLat=(lat2-lat1)*Math.PI/180, dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function useGeolocation(container){
  if(!navigator.geolocation){ alert('Geolocation not supported in this browser.'); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    state.booking.coords = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    if(!state.booking.addressLabel) state.booking.addressLabel = 'Current GPS location';
    render();
  }, err=>{
    // Fallback to a representative UK location for the demo if permission denied
    state.booking.coords = {lat:51.5074+ (Math.random()-0.5)*0.4, lng:-0.1278+(Math.random()-0.5)*0.4};
    state.booking.addressLabel = state.booking.addressLabel || 'Approx. location (permission denied — demo fallback used)';
    render();
  }, {timeout:6000});
}

async function submitBooking(){
  if(backendOnline){
    try{
      const res = await fetch(`${API_BASE}/api/bookings`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({
          customerName: state.booking.name, customerPhone: state.booking.phone,
          addressLabel: state.booking.addressLabel, lat: state.booking.coords.lat, lng: state.booking.coords.lng,
          trade: state.booking.service, jobTypeId: state.booking.jobType,
        }),
      });
      if(!res.ok){ const err = await res.json(); alert(err.error || 'Booking failed.'); return; }
      const raw = await res.json();
      const booking = normalizeBackendBooking(raw);
      state.bookings.unshift(booking);
      state.activeBookingId = booking.id;
      state.chat = [{from:'them', text:`Hi ${state.booking.name.split(' ')[0]||''}, this is ${booking.engineer.name} — I've been assigned your ${booking.jobType.toLowerCase()} job. On my way!`, time: nowStr()}];
      state.photos = [];
      state.rating = 0;
      state.view = 'track';
      joinBookingRoom(booking.id);
      render();
      setTimeout(()=> startTrackingAnimation(booking), 400);
    }catch(e){
      alert('Could not reach the backend — check the API base URL in the banner above.');
    }
    return;
  }

  // ---- Local fallback (no backend connected): simulate the same flow client-side ----
  const job = JOB_TYPES[state.booking.service].find(j=>j.id===state.booking.jobType);
  const vat = (job.part+job.labour)*0.2;
  const total = job.part+job.labour+vat;
  const candidates = ENGINEERS.filter(e=>e.trade===state.booking.service && e.status==='available');
  let best=null, bestDist=Infinity;
  candidates.forEach(e=>{
    const d = haversineKm(state.booking.coords.lat, state.booking.coords.lng, e.lat, e.lng);
    if(d<bestDist){ bestDist=d; best=e; }
  });
  if(!best){ alert('No engineers currently available for this trade — in production this would queue the job.'); return; }
  const etaMin = Math.max(8, Math.round((bestDist/32)*60) + 6);
  const booking = {
    id: uid(), service: state.booking.service, jobType: job.name,
    part: job.part, labour: job.labour, vat, total,
    customer: {name:state.booking.name, phone:state.booking.phone, coords:state.booking.coords, address:state.booking.addressLabel},
    engineer: best, distanceKm: bestDist, etaMin, status:'dispatched',
    createdAt: new Date(), payment: null, review: null, remote:false,
  };
  state.bookings.unshift(booking);
  state.activeBookingId = booking.id;
  state.chat = [{from:'them', text:`Hi ${state.booking.name.split(' ')[0]||''}, this is ${best.name} — I've been assigned your ${job.name.toLowerCase()} job. On my way!`, time: nowStr()}];
  state.photos = [];
  state.rating = 0;
  state.view = 'track';
  render();
  setTimeout(()=> startTrackingAnimation(booking), 400);
}

function joinBookingRoom(bookingId){
  if(!socket) return;
  if(joinedRoom) socket.emit('leave', joinedRoom);
  socket.emit('join', bookingId);
  joinedRoom = bookingId;
}

function initials(name){ return name.split(' ').map(p=>p[0]).slice(0,2).join(''); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

async function advanceStatus(b){
  if(b.remote && backendOnline){
    const order = ['dispatched','enroute','progress','done'];
    const cur = order.indexOf(b.status);
    const next = FE_TO_BE_STATUS[order[Math.min(cur+1,3)]];
    try{
      const res = await fetch(`${API_BASE}/api/bookings/${b.id}/status`, {
        method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({status: next}),
      });
      const raw = await res.json();
      Object.assign(b, normalizeBackendBooking(raw));
    }catch(e){ alert('Could not reach the backend to update status.'); return; }
    if(b.status==='done'){ state.chat.push({from:'them', text:'All done! Job complete — you can view your invoice now.', time:nowStr()}); }
    render();
    setTimeout(()=> startTrackingAnimation(b), 300);
    return;
  }
  const order = ['dispatched','enroute','progress','done'];
  const cur = order.indexOf(b.status);
  b.status = order[Math.min(cur+1, 3)];
  if(b.status==='done'){
    state.chat.push({from:'them', text:'All done! Job complete — you can view your invoice now.', time:nowStr()});
  }
  render();
  setTimeout(()=> startTrackingAnimation(b), 300);
}

function updateLiveEngineerMarker(lat, lng){
  if(!state.marker) return;
  state.marker.setLatLng([lat, lng]);
}

function startTrackingAnimation(b){
  const mapEl = document.getElementById('map');
  if(!mapEl || typeof L==='undefined') return;
  if(state.map){ state.map.remove(); state.map=null; }
  const start = [b.engineer.lat, b.engineer.lng];
  const end = [b.customer.coords.lat, b.customer.coords.lng];
  const map = L.map('map', {zoomControl:true, attributionControl:false});
  state.map = map;
  const bounds = L.latLngBounds([start,end]);
  map.fitBounds(bounds, {padding:[40,40]});
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{maxZoom:19}).addTo(map);

  const custIcon = L.divIcon({className:'', html:`<div style="width:16px;height:16px;border-radius:50%;background:#14213D;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3);"></div>`, iconSize:[16,16]});
  L.marker(end,{icon:custIcon}).addTo(map).bindTooltip('You', {permanent:false});

  const engIcon = L.divIcon({className:'', html:`<div style="width:20px;height:20px;border-radius:50%;background:#FF9F1C;border:3px solid #fff;box-shadow:0 0 0 4px rgba(255,159,28,.25);"></div>`, iconSize:[20,20]});
  const t = b.status==='dispatched'?0.02 : b.status==='enroute'?0.5 : 0.9;
  const cur = [start[0]+(end[0]-start[0])*t, start[1]+(end[1]-start[1])*t];
  const marker = L.marker(cur,{icon:engIcon}).addTo(map).bindTooltip(b.engineer.name.split(' ')[0], {permanent:false});
  state.marker = marker;
  const line = L.polyline([start,end],{color:'#0F8B8D', weight:3, dashArray:'6,7', opacity:.8}).addTo(map);

  if(b.remote && backendOnline){
    // Real mode: position updates arrive over the `engineer:location` socket
    // event pushed from the engineer's app — no local animation needed.
    joinBookingRoom(b.id);
    return;
  }

  if(state.animTimer) clearInterval(state.animTimer);
  if(b.status!=='done'){
    let p = t;
    const target = b.status==='dispatched'?0.5 : b.status==='enroute'?0.9: 0.98;
    state.animTimer = setInterval(()=>{
      p += 0.004;
      if(p>=target){ clearInterval(state.animTimer); return; }
      marker.setLatLng([start[0]+(end[0]-start[0])*p, start[1]+(end[1]-start[1])*p]);
    }, 90);
  }
}

  const photoCard = el('div','card');
  photoCard.innerHTML = `<h3>Job photos</h3><p class="hint">Share photos of the issue so your engineer arrives fully prepared.</p>`;
  const drop = el('div','photo-drop','📷 Click to upload a photo');
  const fileInput = el('input'); fileInput.type='file'; fileInput.accept='image/*'; fileInput.style.display='none';
  fileInput.onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
      state.photos.push(ev.target.result);
      render();
      if(b.remote && backendOnline){
        fetch(`${API_BASE}/api/bookings/${b.id}/photos`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({url: ev.target.result}),
        }).catch(()=> console.warn('Could not save photo to backend.'));
      }
    };
    reader.readAsDataURL(file);
  };
  drop.onclick = ()=> fileInput.click();
  photoCard.appendChild(drop); photoCard.appendChild(fileInput);
  if(state.photos.length){
    const grid = el('div','photo-grid');
    state.photos.forEach(src=>{ const img=el('img'); img.src=src; grid.appendChild(img); });
    photoCard.appendChild(grid);
  }
  right.appendChild(photoCard);

  const rateCard = el('div','card'); rateCard.style.marginTop='16px';
  rateCard.innerHTML = `<h3>Rate this visit</h3><p class="hint">${b.status==='done' ? 'Job marked complete — let us know how it went.' : 'Available once the job is marked complete.'}</p>`;
  const starsWrap = el('div','stars');
  for(let i=1;i<=5;i++){
    const s = el('span','star'+(i<=state.rating?' filled':''),'★');
    s.style.opacity = b.status==='done' ? '1':'.4';
    s.style.pointerEvents = b.status==='done' ? 'auto':'none';
    s.onclick = ()=>{
      state.rating=i; b.review={stars:i}; render();
      if(b.remote && backendOnline){
        fetch(`${API_BASE}/api/bookings/${b.id}/review`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({stars:i}),
        }).catch(()=> console.warn('Could not save review to backend.'));
      }
    };
    starsWrap.appendChild(s);
  }
  rateCard.appendChild(starsWrap);
  right.appendChild(rateCard);

  wrap.appendChild(left); wrap.appendChild(right);
  return wrap;
}

/* =========================================================
   VIEW: INVOICE (PDF + Stripe-style payment)
   ========================================================= */
function viewInvoice(){
  const b = activeBooking();
  if(!b){
    const wrap = el('div','card');
    wrap.appendChild(el('div','empty', `<div class="big">🧾</div>No invoice yet — book a job to generate one automatically on completion.`));
    return wrap;
  }
  const wrap = el('div','grid2');
  const left = el('div','card');
  const header = el('div','inv-header');
  header.innerHTML = `
    <div><h2 style="font-size:19px;">${state.brand.name}</h2><p class="hint" style="margin-top:2px;">123 Trade Street, London · VAT GB123456789</p></div>
    <div style="text-align:right;"><div class="mono" style="font-weight:700;">${b.id}</div><div class="hint" style="margin-top:2px;">${b.createdAt.toLocaleDateString('en-GB')}</div></div>
  `;
  left.appendChild(header);
  const billTo = el('div',''); billTo.style.margin='16px 0';
  billTo.innerHTML = `<span class="eyebrow" style="color:var(--slate);">Billed to</span><div style="font-weight:700;">${b.customer.name}</div><div class="hint">${b.customer.phone}</div><div class="hint">${b.customer.address}</div>`;
  left.appendChild(billTo);

  const table = el('table','inv-table');
  table.innerHTML = `
    <thead><tr><th>Description</th><th style="text-align:right;">Amount</th></tr></thead>
    <tbody>
      <tr><td>${b.jobType} — parts &amp; materials</td><td class="amt">${fmtGBP(b.part)}</td></tr>
      <tr><td>${b.jobType} — labour (${b.engineer.name})</td><td class="amt">${fmtGBP(b.labour)}</td></tr>
      <tr><td>VAT (20%)</td><td class="amt">${fmtGBP(b.vat)}</td></tr>
      <tr class="inv-total-row"><td>Total due</td><td class="amt">${fmtGBP(b.total)}</td></tr>
    </tbody>
  `;
  left.appendChild(table);

  const pdfBtn = el('button','btn btn-outline','⬇ Download PDF invoice');
  pdfBtn.onclick = ()=>{
    if(b.remote && backendOnline){ window.open(`${API_BASE}/api/bookings/${b.id}/invoice.pdf`, '_blank'); }
    else downloadInvoicePdf(b);
  };
  left.appendChild(pdfBtn);

  const right = el('div','card');
  right.innerHTML = `<h3>Payment</h3><p class="hint">Secure card payment via Stripe, or defer to pay on completion.</p>`;
  const toggle = el('div','pay-toggle');
  const now = el('div','pay-opt'+(b.payment==='now'?' selected':'')); now.innerHTML = `<div class="t">Pay now</div><div class="s">Card via Stripe</div>`;
  const later = el('div','pay-opt'+(b.payment==='later'?' selected':'')); later.innerHTML = `<div class="t">Pay later</div><div class="s">Invoiced on completion</div>`;
  now.onclick = ()=>{ b.payment='now'; render(); };
  later.onclick = ()=>{ b.payment='later'; if(b.remote && backendOnline) fetch(`${API_BASE}/api/bookings/${b.id}/pay-later`, {method:'POST'}); render(); };
  toggle.appendChild(now); toggle.appendChild(later);
  right.appendChild(toggle);

  if(b.payment==='now'){
    const payBtn = el('button','btn btn-primary btn-block','🔒 Pay '+fmtGBP(b.total)+' with Stripe');
    payBtn.onclick = ()=>{
      payBtn.textContent='Processing…'; payBtn.disabled=true;
      if(b.remote && backendOnline){
        fetch(`${API_BASE}/api/bookings/${b.id}/pay-now`, {method:'POST'})
          .then(r=>r.json())
          .then(data=>{ b.paid = !!data.paid || !!data.demoMode; render(); })
          .catch(()=>{ alert('Could not reach the backend to process payment.'); payBtn.textContent='🔒 Pay '+fmtGBP(b.total)+' with Stripe'; payBtn.disabled=false; });
      } else {
        setTimeout(()=>{ b.paid=true; render(); }, 1100);
      }
    };
    right.appendChild(payBtn);
    right.appendChild(el('p','hint', b.remote && backendOnline
      ? 'Connected to the live API — add a real STRIPE_SECRET_KEY on the backend to take genuine card payments instead of demo mode.'
      : 'Demo checkout — connecting a live Stripe secret key + webhook on the backend makes this a real charge and auto-reconciles the invoice.'));
  } else if(b.payment==='later'){
    right.appendChild(el('p','hint','An invoice link will be texted &amp; emailed to the customer once the engineer marks the job complete.'));
  }
  if(b.paid){
    right.appendChild(el('div','loc-pill','✓ Payment received — receipt sent to '+b.customer.phone));
  }

  wrap.appendChild(left); wrap.appendChild(right);
  return wrap;
}

function downloadInvoicePdf(b){
  if(typeof window.jspdf === 'undefined'){ alert('PDF library failed to load.'); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('helvetica','bold'); doc.setFontSize(18); doc.text(state.brand.name, 14, 20);
  doc.setFontSize(10); doc.setFont('helvetica','normal'); doc.text('123 Trade Street, London · VAT GB123456789', 14, 27);
  doc.text('Invoice ' + b.id, 150, 20);
  doc.text(new Date(b.createdAt).toLocaleDateString('en-GB'), 150, 27);

  doc.setFont('helvetica','bold'); doc.text('Billed to', 14, 42);
  doc.setFont('helvetica','normal');
  doc.text(b.customer.name, 14, 48);
  doc.text(b.customer.phone, 14, 53);
  doc.text(b.customer.address, 14, 58);

  let y = 75;
  doc.setFont('helvetica','bold');
  doc.text('Description', 14, y); doc.text('Amount', 180, y, {align:'right'});
  doc.line(14, y+2, 196, y+2);
  doc.setFont('helvetica','normal');
  y += 9;
  doc.text(`${b.jobType} - parts & materials`, 14, y); doc.text(fmtGBP(b.part), 180, y, {align:'right'}); y+=8;
  doc.text(`${b.jobType} - labour (${b.engineer.name})`, 14, y); doc.text(fmtGBP(b.labour), 180, y, {align:'right'}); y+=8;
  doc.text('VAT (20%)', 14, y); doc.text(fmtGBP(b.vat), 180, y, {align:'right'}); y+=4;
  doc.line(14, y+3, 196, y+3); y+=11;
  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text('Total due', 14, y); doc.text(fmtGBP(b.total), 180, y, {align:'right'});

  doc.setFontSize(9); doc.setFont('helvetica','normal');
  doc.text('Thank you for booking with ' + state.brand.name + '.', 14, 280);

  doc.save(`Invoice-${b.id}.pdf`);
}

/* =========================================================
   VIEW: ADMIN (white-label dashboard)
   ========================================================= */
async function refreshAdminFromBackend(){
  if(!authToken) return;
  try{
    const authHeader = {'Authorization': 'Bearer ' + authToken};
    const [bookingsRes, engineersRes, summaryRes] = await Promise.all([
      fetch(`${API_BASE}/api/bookings`, {headers: authHeader}),
      fetch(`${API_BASE}/api/engineers`, {headers: authHeader}),
      fetch(`${API_BASE}/api/admin/summary`, {headers: authHeader}),
    ]);
    if(bookingsRes.status===401 || engineersRes.status===401 || summaryRes.status===401){
      authToken = null; authUser = null; render(); return;
    }
    state.bookings = (await bookingsRes.json()).map(normalizeBackendBooking);
    state.liveEngineers = await engineersRes.json();
    state.liveSummary = await summaryRes.json();
    render();
  }catch(e){ console.warn('Could not refresh admin data from backend.'); }
}

async function ownerLogin(email, password, errBoxId){
  try{
    const res = await fetch(`${API_BASE}/api/auth/login`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({email, password}),
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || 'Login failed');
    authToken = data.token; authUser = data.user;
    await refreshAdminFromBackend();
    render();
  }catch(e){
    const box = document.getElementById(errBoxId);
    if(box) box.textContent = e.message;
  }
}

function viewAdmin(){
  if(backendOnline && !authToken){
    const wrap = el('div','grid2');
    const card = el('div','card');
    card.appendChild(el('h3','','Owner sign in'));
    card.appendChild(el('p','hint','The live dashboard is protected — sign in with an owner account to see real bookings, engineers and revenue from the database.'));
    const errBox = el('div','err-box','');
    const emailField = el('div','field'); emailField.innerHTML = `<label class="field-label">Email</label>`;
    const emailInput = el('input'); emailInput.type='email'; emailInput.value='owner@tradepro360.demo';
    emailField.appendChild(emailInput);
    const passField = el('div','field'); passField.innerHTML = `<label class="field-label">Password</label>`;
    const passInput = el('input'); passInput.type='password'; passInput.value='demo1234';
    passField.appendChild(passInput);
    card.appendChild(emailField); card.appendChild(passField);
    card.appendChild(errBox);
    const btn = el('button','btn btn-primary btn-block','Sign in');
    btn.onclick = ()=> ownerLogin(emailInput.value, passInput.value, 'ownerLoginErr');
    errBox.id = 'ownerLoginErr'; errBox.style.color='var(--danger)'; errBox.style.fontSize='12.5px'; errBox.style.marginBottom='8px';
    card.appendChild(btn);
    card.appendChild(el('p','hint','Demo credentials are pre-filled — this account is seeded automatically by the backend.'));
    wrap.appendChild(card);
    wrap.appendChild(el('div','card', `<h3>What you'll see</h3><p class="hint">Every real booking created through the Book tab, the live engineer roster, and revenue collected via Stripe — all pulled from the actual database once you sign in.</p>`));
    return wrap;
  }
  return viewAdminDashboard();
}

function viewAdminDashboard(){
  const wrap = el('div','');

  if(authUser){
    const who = el('div','brand-chip'); who.style.marginBottom='14px'; who.style.width='fit-content';
    who.innerHTML = `<span class="dot" style="background:var(--success);"></span> Signed in as ${authUser.name} (${authUser.role})`;
    const logoutBtn = el('button','btn btn-outline btn-sm','Log out'); logoutBtn.style.marginLeft='10px';
    logoutBtn.onclick = ()=>{ authToken=null; authUser=null; state.bookings=[]; state.liveEngineers=null; state.liveSummary=null; render(); };
    who.appendChild(logoutBtn);
    wrap.appendChild(who);
  }

  const revenue = state.liveSummary ? state.liveSummary.revenue : state.bookings.reduce((s,b)=> s + (b.paid ? b.total : 0), 0);
  const avgRating = state.liveSummary && state.liveSummary.avgRating != null ? state.liveSummary.avgRating.toFixed(1)
    : (()=>{ const rated = state.bookings.filter(b=>b.review); if(!rated.length) return '—'; return (rated.reduce((s,b)=>s+b.review.stars,0)/rated.length).toFixed(1); })();
  const rosterSource = state.liveEngineers || ENGINEERS.map(e=>({...e, rating_avg:e.rating}));
  const activeEng = rosterSource.filter(e=>e.status==='available').length;

  const kpis = el('div','grid3');
  [
    {num: state.bookings.length, lbl:'Total bookings', delta: state.liveSummary? 'Live from database':(state.bookings.length? '+ local demo data':'—')},
    {num: fmtGBP(revenue), lbl:'Revenue collected', delta: revenue? 'Stripe settled':'No payments yet'},
    {num: avgRating==='—'?'—':'⭐ '+avgRating, lbl:'Avg. customer rating', delta: activeEng+' engineers available'},
  ].forEach(k=>{
    const c = el('div','card kpi');
    c.innerHTML = `<span class="num">${k.num}</span><span class="lbl">${k.lbl}</span><span class="delta">${k.delta}</span>`;
    kpis.appendChild(c);
  });
  wrap.appendChild(kpis);

  const grid = el('div','grid2'); grid.style.marginTop='18px';

  // Bookings table
  const bkCard = el('div','card');
  bkCard.appendChild(el('h3','','All bookings'));
  if(!state.bookings.length){
    bkCard.appendChild(el('div','empty', `<div class="big">🗂️</div>No bookings yet — try the Book tab to create one.`));
  } else {
    const table = el('table','admin-table');
    table.innerHTML = `<thead><tr><th>Ref</th><th>Customer</th><th>Job</th><th>Engineer</th><th>Status</th><th>Total</th></tr></thead>`;
    const tbody = el('tbody');
    state.bookings.forEach(b=>{
      const statusClass = b.status==='dispatched'?'dispatched': b.status==='enroute'?'dispatched': b.status==='progress'?'progress':'done';
      const row = el('tr');
      row.innerHTML = `
        <td class="mono">${b.id}</td>
        <td>${b.customer.name||'—'}</td>
        <td>${b.jobType}</td>
        <td>${b.engineer.name}</td>
        <td><span class="badge ${statusClass}">${cap(b.status)}</span></td>
        <td class="mono">${fmtGBP(b.total)}</td>
      `;
      tbody.appendChild(row);
    });
    table.appendChild(tbody);
    bkCard.appendChild(table);
  }
  grid.appendChild(bkCard);

  // Engineer roster + branding
  const right = el('div','');
  const rosterCard = el('div','card');
  rosterCard.appendChild(el('h3','','Engineer roster'));
  rosterSource.forEach(e=>{
    const row = el('div','eng-roster-row');
    row.innerHTML = `
      <span class="status-tag ${e.status==='available'?'avail':'busy'}"></span>
      <div style="flex:1;"><div style="font-weight:600; font-size:13px;">${e.name}</div><div class="hint" style="margin-top:0;">${cap(e.trade)}${e.city? ' · '+e.city:''}</div></div>
      <span class="mini-tag">${e.status==='available'?'Available':'On job'}</span>
    `;
    rosterCard.appendChild(row);
  });
  right.appendChild(rosterCard);

  const brandCard = el('div','card'); brandCard.style.marginTop='16px';
  brandCard.innerHTML = `<h3>White-label branding</h3><p class="hint">Business owners customise the client-facing app with their own name and accent colour.</p>`;
  const nameField = el('div','field'); nameField.style.marginTop='12px';
  nameField.innerHTML = `<label class="field-label">Business name</label>`;
  const nameInput = el('input'); nameInput.type='text'; nameInput.value=state.brand.name;
  nameInput.oninput = e=>{ state.brand.name = e.target.value || 'TradePro 360'; render(); };
  nameField.appendChild(nameInput);
  brandCard.appendChild(nameField);

  brandCard.appendChild(el('label','field-label','Accent colour'));
  const swatches = el('div','color-swatches');
  ['#FF9F1C','#0F8B8D','#C0392B','#2E7D46','#5B4B8A'].forEach(c=>{
    const sw = el('div','swatch'+(state.brand.color===c?' active':'')); sw.style.background=c;
    sw.onclick = ()=>{ state.brand.color=c; render(); };
    swatches.appendChild(sw);
  });
  brandCard.appendChild(swatches);
  right.appendChild(brandCard);

  grid.appendChild(right);
  wrap.appendChild(grid);
  return wrap;
}

/* ---------------- Init ---------------- */
render();
</script>
